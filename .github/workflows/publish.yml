# Release pipeline: every push to master ships a version to PyPI.
#  - a push that leaves `version` in pyproject.toml unchanged ships the NEXT
#    patch version (bumped, committed back and tagged by this workflow);
#  - a push that raises `version` itself ships exactly that version - the
#    manual path for minor/major releases.
# Trusted publishing (OIDC): no token in the repository. Run steps use no
# ${{ }} interpolation (the version reaches them as a GITHUB_ENV shell
# variable); ${{ }} appears only in step-level `if:` on outputs this
# workflow computed itself. The bump commit is pushed with GITHUB_TOKEN
# (which cannot re-trigger workflows) and carries [skip ci] as a second guard.
name: publish
on:
  push:
    branches: [master]
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # push the version-bump commit and its tag back
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # existing tags decide auto-bump vs manual release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q vb6decompiler tests
      - run: python -m pytest -q
      - run: vb6d mask . --dry-run
      - name: resolve the version to ship
        id: resolve
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tomllib
          p = pathlib.Path("pyproject.toml")
          cur = tomllib.loads(p.read_text(encoding="utf-8"))["project"]["version"]
          tags = set(subprocess.run(["git", "tag", "-l", "v*"], capture_output=True, text=True, check=True).stdout.split())
          if "v" + cur not in tags:
              bump = "no"  # this push already set a new version: ship it as-is
          else:
              parts = cur.split(".")
              if len(parts) != 3 or not all(x.isdigit() for x in parts):
                  raise SystemExit(f"cannot auto-bump version {cur!r}: push a manual version bump instead")
              new = f"{parts[0]}.{parts[1]}.{int(parts[2]) + 1}"
              old_line = f'version = "{cur}"'
              text = p.read_text(encoding="utf-8")
              if text.count(old_line) != 1:
                  raise SystemExit(f"expected exactly one {old_line!r} in pyproject.toml")
              p.write_text(text.replace(old_line, f'version = "{new}"', 1), encoding="utf-8")
              cur, bump = new, "yes"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"bumped={bump}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"RELEASE_VERSION={cur}\n")
          PY
      - name: commit, tag and push the auto-bump
        if: steps.resolve.outputs.bumped == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "v$RELEASE_VERSION [skip ci]"
          git pull --rebase origin master
          git tag "v$RELEASE_VERSION"
          git push origin master "v$RELEASE_VERSION"
      - name: tag a manual release
        if: steps.resolve.outputs.bumped == 'no'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

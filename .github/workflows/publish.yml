# Trusted publishing (OIDC): no token in the repository; run steps use no ${{ }} interpolation.
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -c "import pathlib,sys,tomllib,os; v=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; raise SystemExit(0 if 'v'+v==os.environ['GITHUB_REF_NAME'] else 1)"
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
